services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017/opponent_scout
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
      # Read-only, so the Refresh data button can reload MongoDB with the loader.
      - ./data/seed:/code/data/seed:ro
    depends_on:
      mongo:
        condition: service_healthy
      loader:
        condition: service_completed_successfully

  loader:
    build: .
    command: ["python", "-m", "app.loader"]
    environment:
      MONGO_URI: mongodb://mongo:27017/opponent_scout
    volumes:
      - ./app:/code/app
      - ./data/seed:/code/data/seed:ro
    depends_on:
      mongo:
        condition: service_healthy

  # Optional. Runs the R pulls for the "Refresh data" button. Not built or
  # started by the default docker-compose up --build. Start it with:
  #   docker compose --profile refresh up --build
  # No ports: only the web container can reach it, on the internal network.
  refresher:
    build: ./refresher
    profiles: ["refresh"]
    volumes:
      - ./pulls:/work/pulls:ro
      - ./data/seed:/work/data/seed

  mongo:
    image: mongo:8.0.38
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
