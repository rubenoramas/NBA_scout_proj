{% extends "base.html" %}
{% block title %}Scouting report | Opponent Scout{% endblock %}
{% block page %}scout{% endblock %}
{% block band %}
<section class="band" aria-label="Matchup">
  <div class="band-inner">
    <div id="band-teams" class="band-teams" aria-live="polite"></div>
    <div class="band-row">
      <nav class="tabs" aria-label="Scouting sections">
        <a href="" id="tab-overview">Overview</a>
        <a href="" id="tab-players">Players</a>
        <button type="button" disabled>Shot profiles <span class="tag">Soon</span></button>
        <a href="" id="tab-matchups">Matchups</a>
        <a href="" id="tab-lineups">Lineups</a>
        <a href="" id="tab-rotations">Rotations</a>
        <a href="" id="tab-report">Report</a>
      </nav>
      <div class="band-actions">
        <span id="print-onepagers-note" class="loss band-note" role="alert"></span>
        <button class="btn" type="button" id="print-onepagers" disabled title="One page per player: their five plus anyone with USG% of 25 or higher">Print one-pagers</button>
        <button class="btn btn-primary" type="button" id="generate-report" disabled>Generate report</button>
      </div>
    </div>
  </div>
</section>
{% endblock %}
{% block content %}
<div id="scout" class="dash" aria-live="polite"></div>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/scout.js') }}"></script>
{% endblock %}
