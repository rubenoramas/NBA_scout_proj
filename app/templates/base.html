<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Opponent Scout{% endblock %}</title>
  <link rel="preload" href="{{ url_for('static', filename='fonts/Inter-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/" aria-label="Opponent Scout home">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1.5" style="color: var(--accent)"></circle><path d="M1.5 9h15M9 1.5v15" stroke="currentColor" stroke-width="1.5" style="color: var(--accent)"></path></svg>
      <span class="brand-name">OPPONENT SCOUT</span>
    </a>
    <a id="team-switcher" class="switcher empty" href="/?choose=1">No team selected</a>
    <nav class="mainnav" aria-label="Main">
      <a id="nav-schedule" href="/">Schedule</a>
      <span id="nav-scout" class="nav-disabled" title="Pick a game to scout first">Scouting</span>
      <span class="nav-disabled" aria-disabled="true">Saved reports <span class="tag">Soon</span></span>
    </nav>
    <div class="spacer"></div>
    <div class="search" role="search">
      <label class="search-field">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4.25" stroke="currentColor" stroke-width="1.4" style="color: var(--muted)"></circle><path d="M8.7 8.7l3 3" stroke="currentColor" stroke-width="1.4" style="color: var(--muted)"></path></svg>
        <span class="sr-only">Scout any team</span>
        <input id="search-input" type="search" placeholder="Scout any team" autocomplete="off" aria-controls="search-menu">
        <span class="kbd" aria-hidden="true">/</span>
      </label>
      <ul id="search-menu" class="search-menu" hidden></ul>
    </div>
    <div class="asof" id="asof" hidden>
      <span id="asof-dot" class="dot dot-win" aria-hidden="true"></span>
      <span id="asof-text"></span>
    </div>
  </header>
  {% block band %}{% endblock %}
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
